<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FAF7F2">
  <meta name="description" content="A curated gift tracker for Juliana's Christmas wishlist.">
  <title>Juliana's Christmas Wishlist</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23F8E9EB'/%3E%3Ctext x='32' y='45' font-size='36' text-anchor='middle' fill='%23C98591'%3E%E2%9C%A6%3C/text%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">

  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <div class="page">
    <header class="hero">
      <p class="hero__eyebrow">Christmas 2026 <span class="sparkle" aria-hidden="true">✦</span></p>
      <h1 class="hero__title">Juliana's Wishlist<span class="hero__sparkle" aria-hidden="true">✦</span></h1>
      <p class="hero__subtitle" id="subtitle">Gifts curated from her Pinterest board</p>
    </header>

    <main>
      <section class="stats" aria-labelledby="stats-heading">
        <h2 class="visually-hidden" id="stats-heading">Budget overview</h2>
        <div class="stats__grid" id="stats"></div>
      </section>

      <nav class="filters" aria-label="Filter by category">
        <div class="filters__scroller" id="filters"></div>
      </nav>

      <section aria-labelledby="gifts-heading">
        <h2 class="visually-hidden" id="gifts-heading">Gifts</h2>
        <div class="grid" id="grid"></div>
      </section>
    </main>

    <footer class="footer">
      <p>Made with <span class="sparkle" aria-hidden="true">✦</span><span class="visually-hidden">love</span> for Juliana</p>
    </footer>
  </div>
</body>
</html>
